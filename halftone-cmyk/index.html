<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maven — The Irreplaceable Skills Report 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,700;8..60,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FAFAF8;
    --navy: #0F1B4C;
    --blue: #1e51ca;
    --accent-blue: #2465e8;
    --green: #cdff92;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--navy);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .page {
    width: 100vw; height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px;
  }

  .logo-group {
    display: flex; align-items: center; gap: 10px;
  }

  .logo-mark {
    width: 32px; height: 32px;
    background: var(--navy);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: 'Source Serif 4', serif;
    font-weight: 900;
    font-size: 18px;
    line-height: 1;
  }

  .logo-text {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--navy);
  }

  .header-report {
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
    opacity: 0.6;
    letter-spacing: 0.01em;
  }

  /* ── Main layout ── */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 40px;
    position: relative;
  }

  /* ── Left content ── */
  .left-content {
    width: 40%;
    max-width: 520px;
    z-index: 10;
    padding-top: 20px;
  }

  .hero-text {
    font-family: 'Source Serif 4', serif;
    font-size: clamp(36px, 4vw, 56px);
    font-weight: 900;
    line-height: 1.1;
    color: var(--navy);
    margin-bottom: 20px;
  }

  .hero-text .topic-line {
    display: block;
    position: relative;
    height: 1.15em;
    overflow: hidden;
  }

  .topic-word {
    display: inline-block;
    color: var(--blue);
    position: absolute;
    left: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .topic-word.active {
    opacity: 1;
    transform: translateY(0);
  }

  .topic-word.exit-up {
    opacity: 0;
    transform: translateY(-0.4em);
  }

  .topic-word.enter-below {
    opacity: 0;
    transform: translateY(0.4em);
  }

  .subheadline {
    font-family: 'Source Serif 4', serif;
    font-size: clamp(15px, 1.3vw, 18px);
    font-weight: 300;
    color: var(--navy);
    opacity: 0.7;
    line-height: 1.5;
    margin-bottom: 32px;
    max-width: 400px;
  }

  /* ── Email capture card ── */
  .email-card {
    background: #fff;
    border: 1px solid rgba(15, 27, 76, 0.08);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 1px 3px rgba(15, 27, 76, 0.04), 0 8px 24px rgba(15, 27, 76, 0.06);
    max-width: 420px;
  }

  .email-card h3 {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--navy);
  }

  .input-row {
    display: flex; gap: 8px;
  }

  .input-row input {
    flex: 1;
    height: 44px;
    border: 1.5px solid rgba(15, 27, 76, 0.12);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    transition: border-color 0.2s;
  }

  .input-row input::placeholder {
    color: rgba(15, 27, 76, 0.35);
  }

  .input-row input:focus {
    border-color: var(--blue);
  }

  .input-row button {
    height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    background: var(--blue);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
  }

  .input-row button:hover {
    background: var(--accent-blue);
  }

  .input-row button:active {
    transform: scale(0.97);
  }

  /* ── CMYK Canvas (right side) ── */
  .portrait-area {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 58%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cmykCanvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }

  /* ── Instructor label ── */
  .instructor-label {
    position: fixed;
    bottom: 28px;
    right: 40px;
    z-index: 10;
    text-align: right;
  }

  .instructor-name {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    transition: opacity 0.4s;
  }

  .instructor-credential {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--navy);
    opacity: 0.5;
    margin-top: 2px;
    transition: opacity 0.4s;
  }

  /* ── Subtle dot grid on background ── */
  .page::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle, rgba(30, 81, 202, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header>
    <div class="logo-group">
      <div class="logo-mark">M</div>
      <span class="logo-text">Maven</span>
    </div>
    <span class="header-report">The Irreplaceable Skills Report 2026</span>
  </header>

  <!-- Main -->
  <div class="main">

    <!-- Left: Hero + CTA -->
    <div class="left-content">
      <h1 class="hero-text">
        Learn<br>
        <span class="topic-line" id="topicLine"></span>
        from humans
      </h1>
      <p class="subheadline">When the world won't stop moving, don't stop learning.</p>
      <div class="email-card">
        <h3>Get your personalized report</h3>
        <div class="input-row">
          <input type="email" placeholder="you@email.com" aria-label="Email address">
          <button type="button">Get the report</button>
        </div>
      </div>
    </div>

    <!-- Right: CMYK portrait canvas -->
    <div class="portrait-area">
      <canvas id="cmykCanvas"></canvas>
    </div>
  </div>

  <!-- Instructor label -->
  <div class="instructor-label">
    <div class="instructor-name" id="instrName"></div>
    <div class="instructor-credential" id="instrCred"></div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const INSTRUCTORS = [
  { name: "Shreyas Doshi", topic: "Product Sense", credential: "#1 course on Maven, Ex-Stripe & Google PM", img: "../images/shreyas-doshi.png" },
  { name: "Annie Duke", topic: "Decision Making", credential: "Former pro poker player, Bestselling author", img: "../images/annie-duke.jpg" },
  { name: "Colin Matthews", topic: "Vibe Coding", credential: "8,500+ students, Vibe Coding pioneer", img: "../images/colin-matthews.png" },
  { name: "Ethan Evans", topic: "Executive Influence", credential: "Ex-Amazon VP, 59,000+ students", img: "../images/ethan-evans.jpg" },
  { name: "Wes Kao", topic: "Executive Communication", credential: "Co-founder Maven, Executive Influence", img: "../images/wes-kao.jpg" },
  { name: "Marily Nika", topic: "AI Product Management", credential: "Google/Meta AI PM Lead, PhD ML", img: "../images/marily-nika.jpg" },
  { name: "Dave Kline", topic: "Management & Leadership", credential: "20+ years leading engineering teams", img: "../images/dave-kline.jpg" },
  { name: "Hamel Husain", topic: "AI Evals", credential: "#2 course on Maven, parlance-labs founder", img: "../images/hamel-husain.jpg" },
  { name: "Jason Liu", topic: "RAG & LLM Apps", credential: "25,000+ signups, Applied LLM systems", img: "../images/jason-liu.png" },
  { name: "Xinran Ma", topic: "UX Design", credential: "17,000+ signups, AI-native design", img: "../images/xinran-ma.png" },
];

// CMYK channel definitions: Maven-blue dominant palette
const CHANNELS = [
  { name: 'cyan',    color: [30, 81, 202],  angle: 15  },  // Maven blue
  { name: 'magenta', color: [123, 45, 142], angle: 75  },  // muted purple-magenta
  { name: 'yellow',  color: [212, 168, 67], angle: 0   },  // warm gold, desaturated
  { name: 'key',     color: [26, 26, 46],   angle: 45  },  // very dark navy-black
];

const CELL_SIZE = 5;
const CYCLE_DURATION = 5000;
const TRANSITION_DURATION = 1600;
const MAX_SEPARATION = 18;

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentIndex = 0;
let nextIndex = 1;
let transitionProgress = -1; // -1 = settled
let transitionStart = 0;
let lastCycleTime = 0;
let imagesLoaded = {};
let imageElements = {};
let needsRedraw = true;
let lastSeparation = -1;
let lastRenderIndex = -1;

const canvas = document.getElementById('cmykCanvas');
const ctx = canvas.getContext('2d');

// Offscreen canvases for each channel
const channelCanvases = [];
const channelCtxs = [];
for (let i = 0; i < 4; i++) {
  const c = document.createElement('canvas');
  channelCanvases.push(c);
  channelCtxs.push(c.getContext('2d'));
}

// Hidden canvas for image sampling
const hiddenCanvas = document.createElement('canvas');
const hiddenCtx = hiddenCanvas.getContext('2d');

// ─────────────────────────────────────────────
// TOPIC ROTATION
// ─────────────────────────────────────────────
const topicLine = document.getElementById('topicLine');
let currentTopicEl = null;

function setTopic(index, animate) {
  const topic = INSTRUCTORS[index].topic;
  const newEl = document.createElement('span');
  newEl.className = 'topic-word' + (animate ? ' enter-below' : ' active');
  newEl.textContent = topic;
  topicLine.appendChild(newEl);

  if (animate) {
    if (currentTopicEl) {
      const oldEl = currentTopicEl;
      oldEl.classList.remove('active');
      oldEl.classList.add('exit-up');
      setTimeout(() => oldEl.remove(), 500);
    }
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        newEl.classList.remove('enter-below');
        newEl.classList.add('active');
      });
    });
  }
  currentTopicEl = newEl;
}

// ─────────────────────────────────────────────
// INSTRUCTOR LABEL
// ─────────────────────────────────────────────
const nameEl = document.getElementById('instrName');
const credEl = document.getElementById('instrCred');

function setLabel(index, fade) {
  if (fade) {
    nameEl.style.opacity = '0';
    credEl.style.opacity = '0';
    setTimeout(() => {
      nameEl.textContent = INSTRUCTORS[index].name;
      credEl.textContent = INSTRUCTORS[index].credential;
      nameEl.style.opacity = '1';
      credEl.style.opacity = '0.5';
    }, 400);
  } else {
    nameEl.textContent = INSTRUCTORS[index].name;
    credEl.textContent = INSTRUCTORS[index].credential;
  }
}

// ─────────────────────────────────────────────
// IMAGE LOADING
// ─────────────────────────────────────────────
function loadImage(index) {
  return new Promise((resolve) => {
    if (imagesLoaded[index]) { resolve(); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      imageElements[index] = img;
      imagesLoaded[index] = true;
      resolve();
    };
    img.onerror = () => {
      // Placeholder fallback
      const c = document.createElement('canvas');
      c.width = 400; c.height = 500;
      const cx = c.getContext('2d');
      // Gradient placeholder
      const g = cx.createLinearGradient(0, 0, 400, 500);
      g.addColorStop(0, '#c8d4e8');
      g.addColorStop(1, '#8899bb');
      cx.fillStyle = g;
      cx.fillRect(0, 0, 400, 500);
      cx.fillStyle = '#556';
      cx.font = '600 22px Inter, sans-serif';
      cx.textAlign = 'center';
      cx.fillText(INSTRUCTORS[index].name, 200, 260);
      const placeholder = new Image();
      placeholder.src = c.toDataURL();
      placeholder.onload = () => {
        imageElements[index] = placeholder;
        imagesLoaded[index] = true;
        resolve();
      };
    };
    img.src = INSTRUCTORS[index].img;
  });
}

function preloadNext(count) {
  for (let i = 0; i < count; i++) {
    const idx = (currentIndex + i + 1) % INSTRUCTORS.length;
    loadImage(idx);
  }
}

// ─────────────────────────────────────────────
// CANVAS SIZING
// ─────────────────────────────────────────────
let canvasW = 0, canvasH = 0, dpr = 1;

function sizeCanvas() {
  const area = canvas.parentElement;
  canvasW = area.clientWidth;
  canvasH = area.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  for (let i = 0; i < 4; i++) {
    channelCanvases[i].width = canvasW * dpr;
    channelCanvases[i].height = canvasH * dpr;
    channelCtxs[i].setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Invalidate cache on resize
  cachedImageData = {};
  needsRedraw = true;
}

window.addEventListener('resize', sizeCanvas);

// ─────────────────────────────────────────────
// SAMPLE IMAGE DATA
// ─────────────────────────────────────────────
function getImagePixelData(imgEl, targetW, targetH) {
  hiddenCanvas.width = targetW;
  hiddenCanvas.height = targetH;
  hiddenCtx.clearRect(0, 0, targetW, targetH);

  // Center-crop the image to fill target dimensions (top-aligned for portraits)
  const imgAspect = imgEl.naturalWidth / imgEl.naturalHeight;
  const targetAspect = targetW / targetH;
  let sx, sy, sw, sh;
  if (imgAspect > targetAspect) {
    sh = imgEl.naturalHeight;
    sw = sh * targetAspect;
    sx = (imgEl.naturalWidth - sw) / 2;
    sy = 0;
  } else {
    sw = imgEl.naturalWidth;
    sh = sw / targetAspect;
    sx = 0;
    sy = 0;
  }

  hiddenCtx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, targetW, targetH);
  return hiddenCtx.getImageData(0, 0, targetW, targetH);
}

// ─────────────────────────────────────────────
// HALFTONE DOT GRID — one channel
// ─────────────────────────────────────────────
function renderHalftoneChannel(chCtx, imageData, channelIndex, cW, cH, offsetX, offsetY) {
  const ch = CHANNELS[channelIndex];
  const angle = ch.angle * Math.PI / 180;
  const [cr, cg, cb] = ch.color;
  const cell = CELL_SIZE;
  const maxR = cell * 0.55;
  const imgW = imageData.width;
  const imgH = imageData.height;
  const data = imageData.data;

  // Image centered in canvas
  const imgOX = (cW - imgW) / 2;
  const imgOY = (cH - imgH) / 2;

  const cosN = Math.cos(-angle);
  const sinN = Math.sin(-angle);
  const cosP = Math.cos(angle);
  const sinP = Math.sin(angle);

  // Find grid bounds in rotated space
  const pts = [[0, 0], [cW, 0], [cW, cH], [0, cH]];
  let uMin = 1e9, uMax = -1e9, vMin = 1e9, vMax = -1e9;
  for (const [px, py] of pts) {
    const u = px * cosN - py * sinN;
    const v = px * sinN + py * cosN;
    uMin = Math.min(uMin, u); uMax = Math.max(uMax, u);
    vMin = Math.min(vMin, v); vMax = Math.max(vMax, v);
  }
  uMin = Math.floor(uMin / cell) * cell;
  uMax = Math.ceil(uMax / cell) * cell;
  vMin = Math.floor(vMin / cell) * cell;
  vMax = Math.ceil(vMax / cell) * cell;

  chCtx.clearRect(0, 0, cW, cH);

  // Batch paths by similar alpha for fewer style changes
  for (let u = uMin; u <= uMax; u += cell) {
    for (let v = vMin; v <= vMax; v += cell) {
      const px = u * cosP - v * sinP;
      const py = u * sinP + v * cosP;

      const ix = Math.round(px - imgOX);
      const iy = Math.round(py - imgOY);
      if (ix < 0 || ix >= imgW || iy < 0 || iy >= imgH) continue;

      const idx = (iy * imgW + ix) * 4;
      const r = data[idx] / 255;
      const g = data[idx + 1] / 255;
      const b = data[idx + 2] / 255;
      const a = data[idx + 3] / 255;
      if (a < 0.1) continue;

      // RGB to CMYK
      const kVal = 1 - Math.max(r, g, b);
      let cv;
      if (kVal >= 0.999) {
        cv = (channelIndex === 3) ? 1 : 0;
      } else {
        const invK = 1 / (1 - kVal);
        switch (channelIndex) {
          case 0: cv = (1 - r - kVal) * invK; break;
          case 1: cv = (1 - g - kVal) * invK; break;
          case 2: cv = (1 - b - kVal) * invK; break;
          case 3: cv = kVal; break;
        }
      }

      cv = Math.max(0, Math.min(1, cv));

      // Blue dominance adjustments
      if (channelIndex === 0) cv = Math.min(1, cv * 1.2);   // boost cyan
      if (channelIndex === 2) cv *= 0.55;                     // reduce yellow
      if (channelIndex === 1) cv *= 0.85;                     // slightly reduce magenta

      if (cv < 0.02) continue;

      const radius = maxR * Math.sqrt(cv);
      const dx = px + offsetX;
      const dy = py + offsetY;

      chCtx.beginPath();
      chCtx.arc(dx, dy, radius, 0, 6.2832);
      chCtx.fillStyle = `rgba(${cr},${cg},${cb},${(0.7 + cv * 0.3).toFixed(2)})`;
      chCtx.fill();
    }
  }
}

// ─────────────────────────────────────────────
// IMAGE DATA CACHE
// ─────────────────────────────────────────────
let cachedImageData = {};

function getOrCacheImageData(index) {
  const maxH = Math.round(canvasH * 0.85);
  const maxW = Math.round(canvasW * 0.7);
  const img = imageElements[index];
  if (!img) return null;

  const aspect = img.naturalWidth / img.naturalHeight;
  let w, h;
  if (aspect > maxW / maxH) {
    w = maxW;
    h = Math.round(w / aspect);
  } else {
    h = maxH;
    w = Math.round(h * aspect);
  }

  const key = `${index}_${w}_${h}`;
  if (cachedImageData[key]) return cachedImageData[key];

  const pixData = getImagePixelData(img, w, h);
  cachedImageData[key] = { data: pixData, w, h };
  return cachedImageData[key];
}

// ─────────────────────────────────────────────
// EASING
// ─────────────────────────────────────────────
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// ─────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────
function renderFrame(timestamp) {
  // Determine transition state
  let separation = 0;
  let renderIndex = currentIndex;

  if (transitionProgress >= 0) {
    const elapsed = timestamp - transitionStart;
    const t = Math.min(elapsed / TRANSITION_DURATION, 1);

    if (t >= 1) {
      transitionProgress = -1;
      currentIndex = nextIndex;
      renderIndex = currentIndex;
      separation = 0;
      lastCycleTime = timestamp;
    } else {
      transitionProgress = t;
      // Phases:
      //   0.00 - 0.35  separation (current image spreads)
      //   0.35 - 0.65  abstract peak, swap at 0.50
      //   0.65 - 1.00  convergence (new image converges)
      if (t < 0.35) {
        const p = t / 0.35;
        separation = MAX_SEPARATION * easeInOutCubic(p);
        renderIndex = currentIndex;
      } else if (t < 0.65) {
        separation = MAX_SEPARATION;
        renderIndex = t < 0.5 ? currentIndex : nextIndex;
      } else {
        const p = (t - 0.65) / 0.35;
        separation = MAX_SEPARATION * (1 - easeInOutCubic(p));
        renderIndex = nextIndex;
      }
    }
    needsRedraw = true;
  }

  // Auto-cycle trigger
  if (transitionProgress < 0 && timestamp - lastCycleTime > CYCLE_DURATION) {
    startTransition(timestamp);
    needsRedraw = true;
  }

  // Only redraw when something changed
  if (!needsRedraw && separation === lastSeparation && renderIndex === lastRenderIndex) {
    requestAnimationFrame(renderFrame);
    return;
  }

  lastSeparation = separation;
  lastRenderIndex = renderIndex;
  needsRedraw = (transitionProgress >= 0); // keep redrawing during transitions

  const imgInfo = getOrCacheImageData(renderIndex);
  if (!imgInfo) {
    requestAnimationFrame(renderFrame);
    return;
  }

  // Calculate per-channel offsets
  const offsets = CHANNELS.map(ch => {
    const a = ch.angle * Math.PI / 180;
    return { x: Math.cos(a) * separation, y: Math.sin(a) * separation };
  });

  // Render 4 channels to offscreen canvases
  for (let i = 0; i < 4; i++) {
    renderHalftoneChannel(channelCtxs[i], imgInfo.data, i, canvasW, canvasH, offsets[i].x, offsets[i].y);
  }

  // Composite directly to main canvas:
  // 1. Fill with page background color ("paper")
  // 2. Layer each CMYK channel on top using source-over
  //    The semi-transparent dots accumulate naturally, just like ink dots on paper.
  //    Because each channel uses a different grid angle, dots mostly sit beside each other
  //    with minimal overlap — authentic halftone behavior.
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#FAFAF8';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Draw channels in order: Yellow (lightest), Magenta, Cyan, Key (darkest on top)
  // This mimics real print order and ensures the blue-dominant channels are most visible
  const drawOrder = [2, 1, 0, 3]; // Y, M, C, K
  for (const i of drawOrder) {
    ctx.drawImage(channelCanvases[i], 0, 0, canvasW, canvasH);
  }
  const vg = ctx.createRadialGradient(
    canvasW * 0.48, canvasH * 0.45, Math.min(canvasW, canvasH) * 0.22,
    canvasW * 0.48, canvasH * 0.45, Math.min(canvasW, canvasH) * 0.62
  );
  vg.addColorStop(0, 'rgba(250, 250, 248, 0)');
  vg.addColorStop(0.7, 'rgba(250, 250, 248, 0)');
  vg.addColorStop(1, 'rgba(250, 250, 248, 0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvasW, canvasH);

  requestAnimationFrame(renderFrame);
}

function startTransition(timestamp) {
  nextIndex = (currentIndex + 1) % INSTRUCTORS.length;
  preloadNext(3);

  if (!imagesLoaded[nextIndex]) {
    loadImage(nextIndex).then(() => {
      transitionStart = performance.now();
      transitionProgress = 0;
      setTopic(nextIndex, true);
      setLabel(nextIndex, true);
      trimCache();
    });
    return;
  }

  transitionStart = timestamp;
  transitionProgress = 0;
  lastCycleTime = timestamp;
  setTopic(nextIndex, true);
  setLabel(nextIndex, true);
  trimCache();
}

function trimCache() {
  const keep = new Set();
  for (const k of Object.keys(cachedImageData)) {
    if (k.startsWith(currentIndex + '_') || k.startsWith(nextIndex + '_')) {
      keep.add(k);
    }
  }
  for (const k of Object.keys(cachedImageData)) {
    if (!keep.has(k)) delete cachedImageData[k];
  }
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  sizeCanvas();
  await loadImage(0);

  setTopic(0, false);
  setLabel(0, false);
  preloadNext(3);

  lastCycleTime = performance.now();
  needsRedraw = true;
  requestAnimationFrame(renderFrame);
}

init();
</script>
</body>
