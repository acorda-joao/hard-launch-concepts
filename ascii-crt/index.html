<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maven — The Irreplaceable Skills Report 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,700;0,8..60,900;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#080c28; color:#fff;
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ---- CRT Overlay ---- */
  #crt-overlay { position:fixed; inset:0; pointer-events:none; z-index:100; }

  #crt-overlay::before {
    content:''; position:absolute; inset:0; z-index:101;
    background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px);
  }

  #crt-overlay::after {
    content:''; position:absolute; left:0; right:0; height:80px; z-index:102;
    background:linear-gradient(to bottom,transparent,rgba(62,137,255,0.03),rgba(62,137,255,0.05),rgba(62,137,255,0.03),transparent);
    animation:scanBeam 8s linear infinite;
  }

  @keyframes scanBeam { 0%{top:-80px} 100%{top:100%} }

  /* ---- Layout ---- */
  #page { position:relative; width:100vw; height:100vh; overflow:hidden; }

  /* ---- Header ---- */
  #header {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 40px; z-index:50;
    background:linear-gradient(to bottom,rgba(8,12,40,0.8),transparent);
  }

  .header-left { display:flex; align-items:center; gap:10px; }
  .maven-logo svg { display:block; height:24px; width:auto; }
  .header-right { font-size:13px; font-weight:500; color:rgba(255,255,255,0.5); letter-spacing:0.02em; }

  /* ---- Left content ---- */
  #left-content {
    position:fixed; left:40px; top:50%; transform:translateY(-50%);
    z-index:40; max-width:420px;
  }

  .hero-text {
    font-family:'Source Serif 4',serif; font-weight:900;
    font-size:52px; line-height:1.12; letter-spacing:-0.02em;
    margin-bottom:20px;
  }

  .hero-topic {
    display:inline-block; color:#3e89ff;
    transition:opacity 0.25s cubic-bezier(0.25,0.46,0.45,0.94),
               transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    min-width:200px;
  }
  .hero-topic.fading { opacity:0; transform:translateY(-6px); }

  .hero-tagline {
    font-family:'Source Serif 4',serif; font-size:16px; font-weight:300;
    color:rgba(255,255,255,0.4); line-height:1.5; margin-bottom:36px; max-width:340px;
  }

  /* ---- Glass card ---- */
  .glass-card {
    background:rgba(12,16,36,0.85);
    border:1px solid rgba(74,127,212,0.15);
    border-radius:12px;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    padding:24px; width:fit-content;
  }
  .glass-card h3 { font-size:15px; font-weight:600; margin-bottom:16px; color:rgba(255,255,255,0.9); }

  .input-row { display:flex; gap:8px; }
  .input-row input {
    flex:1; padding:10px 14px;
    border:1px solid rgba(74,127,212,0.2); border-radius:8px;
    background:rgba(8,12,40,0.6); color:#fff;
    font-family:'Inter',sans-serif; font-size:16px; outline:none;
    transition:border-color 0.15s ease;
  }
  .input-row input::placeholder { color:rgba(255,255,255,0.3); }
  .input-row input:focus { border-color:rgba(62,137,255,0.5); }

  .input-row button {
    padding:10px 20px; border:none; border-radius:8px;
    background:#fff; color:#080c28;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
    cursor:pointer; white-space:nowrap;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .input-row button:hover { background:#cdff92; }
  .input-row button:focus-visible { outline:2px solid #3e89ff; outline-offset:2px; }
  .input-row button:active { transform:scale(0.97); }

  /* ---- Canvas ---- */
  #ascii-canvas {
    position:fixed; top:0; left:0; width:100%; height:100vh; z-index:10;
  }

  /* ---- Instructor label ---- */
  #instructor-label {
    position:fixed; bottom:32px; right:40px; text-align:right; z-index:40;
    transition:opacity 0.25s cubic-bezier(0.25,0.46,0.45,0.94),
               transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  #instructor-label.fading { opacity:0; transform:translateY(4px); }

  .instructor-name { font-family:'Source Serif 4',serif; font-size:18px; font-weight:700; color:rgba(255,255,255,0.8); margin-bottom:2px; }
  .instructor-credential { font-size:12px; color:rgba(255,255,255,0.35); max-width:300px; }

  /* ---- Vignette ---- */
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:30;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(8,12,40,0.6) 100%);
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    #crt-overlay::after { animation:none; }
    .hero-topic { transition:none; }
    #instructor-label { transition:none; }
  }
</style>
</head>

<script>
(function() {
  'use strict';

  const INSTRUCTORS = [
    { name:"Shreyas Doshi",  topic:"Product Sense",           credential:"#1 course on Maven, Ex-Stripe & Google PM",  img:"../images/shreyas-doshi.png"  },
    { name:"Annie Duke",     topic:"Decision Making",         credential:"Former pro poker player, Bestselling author", img:"../images/annie-duke.jpg"     },
    { name:"Colin Matthews", topic:"Vibe Coding",             credential:"8,500+ students, Vibe Coding pioneer",       img:"../images/colin-matthews.png" },
    { name:"Ethan Evans",    topic:"Executive Influence",     credential:"Ex-Amazon VP, 59,000+ students",             img:"../images/ethan-evans.jpg"   },
    { name:"Wes Kao",        topic:"Executive Communication", credential:"Co-founder Maven, Executive Influence",      img:"../images/wes-kao.jpg"       },
    { name:"Marily Nika",    topic:"AI Product Management",   credential:"Google/Meta AI PM Lead, PhD ML",             img:"../images/marily-nika.jpg"   },
    { name:"Dave Kline",     topic:"Management & Leadership", credential:"20+ years leading engineering teams",        img:"../images/dave-kline.jpg"    },
    { name:"Hamel Husain",   topic:"AI Evals",                credential:"#2 course on Maven, parlance-labs founder",  img:"../images/hamel-husain.jpg"  },
    { name:"Jason Liu",      topic:"RAG & LLM Apps",          credential:"25,000+ signups, Applied LLM systems",      img:"../images/jason-liu.png"     },
    { name:"Xinran Ma",      topic:"UX Design",               credential:"17,000+ signups, AI-native design",         img:"../images/xinran-ma.png"     },
  ];

  // DOM
  const canvas    = document.getElementById('ascii-canvas');
  const ctx       = canvas.getContext('2d');
  const topicEl   = document.getElementById('hero-topic');
  const nameEl    = document.getElementById('instructor-name');
  const credEl    = document.getElementById('instructor-credential');
  const labelWrap = document.getElementById('instructor-label');

  // Hidden canvases
  const hiddenCanvas = document.createElement('canvas');
  const hiddenCtx    = hiddenCanvas.getContext('2d', { willReadFrequently:true });
  const offCanvas    = document.createElement('canvas');
  const offCtx       = offCanvas.getContext('2d');

  // Config
  const BASE_CHARS   = '.:-~=+';
  const ASCII_RAMP   = ' .:-=+*#%@';
  const CELL         = 8;
  const CELL_H       = CELL * 1.5;
  const CYCLE_MS     = 5000;
  const TRANSITION_MS= 1200;

  // State
  let currentIndex = 0;
  let cols = 0, rows = 0;
  let grid = [];          // full-screen character grid
  let canvasW = 0, canvasH = 0;
  let images = [];
  let started = false;
  let lastCycleTime = 0;
  let transitionProgress = -1; // -1 = idle, 0..1 = transitioning
  let transitionStart = 0;
  let nextIndex = -1;
  let currentBrightness = null;  // brightness map for current instructor
  let nextBrightness = null;     // brightness map for next instructor
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Preload images ----
  function preloadImages() {
    INSTRUCTORS.forEach((inst, i) => {
      const img = new Image();
      img.onload = () => { if (!started && i === 0) { started = true; init(); } };
      img.onerror = () => { if (!started) { started = true; currentIndex = (i+1)%INSTRUCTORS.length; init(); } };
      img.src = inst.img;
      images[i] = img;
    });
  }

  // ---- Resize ----
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvasW = canvas.clientWidth;
    canvasH = canvas.clientHeight;
    canvas.width  = canvasW * dpr;
    canvas.height = canvasH * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    offCanvas.width  = canvasW * dpr;
    offCanvas.height = canvasH * dpr;
    offCtx.setTransform(dpr,0,0,dpr,0,0);

    cols = Math.floor(canvasW / CELL);
    rows = Math.floor(canvasH / CELL_H);

    // Rebuild grid — denser, more visible base pattern
    grid = new Array(cols * rows);
    for (let i = 0; i < grid.length; i++) {
      grid[i] = {
        char: BASE_CHARS[Math.floor(Math.random() * BASE_CHARS.length)],
        opacity: 0.12 + Math.random() * 0.06,
        targetChar: '.',
        targetOpacity: 0.12,
        phase: Math.random() * Math.PI * 2,
      };
    }

    // Recompute brightness for current instructor
    currentBrightness = sampleBrightness(currentIndex);
    applyBrightnessToGrid(currentBrightness, 1);
  }

  // ---- Detect photo background color from corners ----
  function detectBgColor(data, w, h) {
    const corners = [];
    const sample = (x, y) => {
      const i = (y * w + x) * 4;
      corners.push([data[i], data[i+1], data[i+2]]);
    };
    // Sample several points along edges
    for (let s = 0; s < 5; s++) {
      const t = Math.floor(s * (w-1) / 4);
      sample(t, 0);           // top edge
      sample(t, h-1);         // bottom edge
      sample(0, Math.floor(s*(h-1)/4));   // left edge
      sample(w-1, Math.floor(s*(h-1)/4)); // right edge
    }
    // Average
    let rr=0, gg=0, bb=0;
    corners.forEach(c => { rr+=c[0]; gg+=c[1]; bb+=c[2]; });
    const n = corners.length;
    return [rr/n, gg/n, bb/n];
  }

  // ---- Sample instructor image to a brightness grid (FULL VIEWPORT) ----
  function sampleBrightness(index) {
    const img = images[index];
    if (!img || !img.complete || img.naturalWidth === 0) return null;

    const imgAspect = img.naturalWidth / img.naturalHeight;
    const cellAspect = CELL / CELL_H;

    // Image fills full viewport height, positioned center-right
    let sampleRows = rows;
    let sampleCols = Math.floor(sampleRows * (imgAspect / cellAspect));

    if (sampleCols > cols) {
      sampleCols = cols;
      sampleRows = Math.floor(sampleCols / (imgAspect / cellAspect));
    }

    hiddenCanvas.width  = sampleCols;
    hiddenCanvas.height = sampleRows;
    hiddenCtx.drawImage(img, 0, 0, sampleCols, sampleRows);
    const data = hiddenCtx.getImageData(0, 0, sampleCols, sampleRows).data;

    // Detect photo background color
    const bgColor = detectBgColor(data, sampleCols, sampleRows);

    // Position: center of image lands at ~65% from left edge
    const centerCol = Math.floor(cols * 0.65);
    const offsetX = centerCol - Math.floor(sampleCols / 2);
    const offsetY = Math.floor((rows - sampleRows) / 2);

    const map = new Map();

    for (let r = 0; r < sampleRows; r++) {
      for (let c = 0; c < sampleCols; c++) {
        const px = (r * sampleCols + c) * 4;
        const alpha = data[px + 3];
        if (alpha < 30) continue;

        const pR = data[px], pG = data[px+1], pB = data[px+2];

        // Distance from photo background color (0-1 normalized)
        const dR = pR - bgColor[0], dG = pG - bgColor[1], dB = pB - bgColor[2];
        const bgDist = Math.sqrt(dR*dR + dG*dG + dB*dB) / 441.7; // max dist = sqrt(3*255^2)

        // If pixel is very close to photo bg, skip it — let the base grid show
        // Smooth ramp: below 0.08 = pure bg, above 0.25 = fully portrait
        const subjectStrength = Math.min(1, Math.max(0, (bgDist - 0.08) / 0.17));
        if (subjectStrength < 0.05) continue; // this pixel is photo background, skip

        const brightness = (0.299*pR + 0.587*pG + 0.114*pB) / 255;
        const charIdx = Math.floor(brightness * (ASCII_RAMP.length - 1));
        const ch = ASCII_RAMP[charIdx];

        const gridCol = c + offsetX;
        const gridRow = r + offsetY;
        if (gridCol < 0 || gridCol >= cols || gridRow < 0 || gridRow >= rows) continue;

        const gi = gridRow * cols + gridCol;

        // Focus gradient: stronger on right, fading left
        const xRatio = gridCol / cols;
        const focusMul = Math.min(1, 0.25 + xRatio * 0.95);

        // Combine subject strength (from bg removal) with focus gradient
        const rawOpacity = 0.15 + (1 - brightness) * 0.85;
        const charOpacity = rawOpacity * focusMul * subjectStrength;

        map.set(gi, { char: ch, opacity: Math.max(0.12, charOpacity) });
      }
    }

    return map;
  }

  // ---- Apply brightness map to grid ----
  function applyBrightnessToGrid(brightnessMap, blend) {
    if (!brightnessMap) return;

    for (let i = 0; i < grid.length; i++) {
      const cell = grid[i];
      const mapped = brightnessMap.get(i);

      if (mapped) {
        cell.targetChar = mapped.char;
        cell.targetOpacity = mapped.opacity;
      } else {
        cell.targetChar = BASE_CHARS[Math.floor(Math.random() * BASE_CHARS.length)];
        cell.targetOpacity = 0.12 + Math.random() * 0.04;
      }

      if (blend >= 1) {
        cell.char = cell.targetChar;
        cell.opacity = cell.targetOpacity;
      }
    }
  }

  // ---- Start transition ----
  function startTransition(toIndex) {
    if (!images[toIndex] || !images[toIndex].complete || images[toIndex].naturalWidth === 0) {
      lastCycleTime = performance.now();
      return;
    }

    nextIndex = toIndex;
    nextBrightness = sampleBrightness(toIndex);
    transitionProgress = 0;
    transitionStart = performance.now();

    topicEl.classList.add('fading');
    labelWrap.classList.add('fading');

    // Update text at midpoint
    setTimeout(() => {
      topicEl.textContent = INSTRUCTORS[toIndex].topic;
      nameEl.textContent  = INSTRUCTORS[toIndex].name;
      credEl.textContent  = INSTRUCTORS[toIndex].credential;
      topicEl.classList.remove('fading');
      labelWrap.classList.remove('fading');
    }, TRANSITION_MS * 0.45);
  }

  // ---- Animation loop ----
  function animate(now) {
    requestAnimationFrame(animate);

    // ---- Update transition ----
    if (transitionProgress >= 0) {
      transitionProgress = Math.min((now - transitionStart) / TRANSITION_MS, 1);

      // Wave sweep: columns transition left-to-right
      const waveFront = transitionProgress * (cols + 20);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const i = r * cols + c;
          const cell = grid[i];
          const distFromWave = c - waveFront;

          if (distFromWave < -10) {
            // Behind the wave: show next portrait
            const mapped = nextBrightness ? nextBrightness.get(i) : null;
            if (mapped) {
              cell.char = mapped.char;
              cell.opacity = mapped.opacity;
            } else {
              if (cell.opacity > 0.2) {
                cell.char = BASE_CHARS[Math.floor(Math.random() * BASE_CHARS.length)];
              }
              cell.opacity = 0.12 + Math.random() * 0.04;
            }
          } else if (distFromWave < 10) {
            // In the wave: scramble
            cell.char = ASCII_RAMP[Math.floor(Math.random() * ASCII_RAMP.length)];
            cell.opacity = 0.2 + Math.random() * 0.3;
          }
          // Ahead of wave: keep current state (old portrait or base)
        }
      }

      if (transitionProgress >= 1) {
        transitionProgress = -1;
        currentIndex = nextIndex;
        currentBrightness = nextBrightness;
        lastCycleTime = now;
      }

    } else {
      // Idle: auto-cycle
      if (now - lastCycleTime > CYCLE_MS) {
        startTransition((currentIndex + 1) % INSTRUCTORS.length);
      }
    }

    // ---- Clear ----
    ctx.fillStyle = '#080c28';
    ctx.fillRect(0, 0, canvasW, canvasH);

    // ---- Render grid to offscreen buffer ----
    offCtx.clearRect(0, 0, canvasW, canvasH);
    offCtx.font = CELL + 'px "Courier New",monospace';
    offCtx.textBaseline = 'top';
    offCtx.fillStyle = '#3e89ff';

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r * cols + c];
        if (cell.opacity < 0.02) continue;

        // Subtle animated shimmer for base chars
        let op = cell.opacity;
        if (op < 0.2) {
          op += Math.sin(now * 0.0008 + cell.phase) * 0.02;
        }

        offCtx.globalAlpha = Math.max(0, Math.min(1, op));
        offCtx.fillText(cell.char, c * CELL, r * CELL_H);
      }
    }
    offCtx.globalAlpha = 1;

    // ---- Composite: glow + crisp ----
    ctx.save();
    ctx.filter = 'blur(5px)';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(offCanvas, 0, 0, canvasW, canvasH);
    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.drawImage(offCanvas, 0, 0, canvasW, canvasH);
  }

  // ---- Init ----
  function init() {
    resize();
    currentBrightness = sampleBrightness(currentIndex);
    applyBrightnessToGrid(currentBrightness, 1);

    lastCycleTime = performance.now();
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  preloadImages();

})();
</script>

</body>
</html>
